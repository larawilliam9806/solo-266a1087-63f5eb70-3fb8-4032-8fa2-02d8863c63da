services:
  census:
    build: .
    image: census-archive:latest
    ports:
      - "${CENSUS_PORT:-8000}:8000"
    environment:
      CENSUS_DB: /data/archive.sqlite3
    volumes:
      - census-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  census-data:
